name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    services:
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/engramdb-ci
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      ENGRAM_TEST_NEO4J_URI: bolt://localhost:7687
      ENGRAM_TEST_NEO4J_USER: neo4j
      ENGRAM_TEST_NEO4J_PASSWORD: engramdb-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -v
