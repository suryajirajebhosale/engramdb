# Local Neo4j for engramdb development, examples and the Neo4j test suite.
#   docker compose up -d neo4j
# Browser: http://localhost:7474   Bolt: bolt://localhost:7687
# Credentials must match NEO4J_PASSWORD / ENGRAM_TEST_NEO4J_PASSWORD in your .env.
services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-engramdb-dev}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  neo4j-data:
