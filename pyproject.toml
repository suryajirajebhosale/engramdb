[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engramdb"
version = "0.1.0"
description = "Graph-based long-term user memory for LLM apps: consolidation, decay, spreading activation and personalised re-ranking."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Suryajiraje Bhosale" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["llm", "memory", "personalization", "knowledge-graph", "agents", "spreading-activation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.40", "python-dotenv>=1.0"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/engramdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
